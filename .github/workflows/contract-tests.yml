name: Contract tests

# Testy kontraktów odpytują prawdziwe OLX i Otodom, więc nie uruchamiamy ich
# przy każdym pushu — tylko codziennie i na żądanie (zakładka Actions → Run workflow).
on:
  schedule:
    - cron: "17 6 * * *"   # codziennie 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-tests
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Run contract tests
        run: uv run pytest -rfs --junitxml=report.xml

      - name: Summary
        if: always()
        # sama biblioteka standardowa — działa nawet, gdy instalacja zależności padła
        run: python3 .github/scripts/contract_summary.py report.xml
