<svg xmlns="http://www.w3.org/2000/svg" width="40" height="64" viewBox="0 0 40 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="tram-cien" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <clipPath id="tram-tablica">
      <rect x="3" y="1" width="34" height="46" rx="6"/>
    </clipPath>
  </defs>

  <!-- cień u podstawy słupka -->
  <ellipse cx="20" cy="60" rx="5" ry="2" fill="#000000" fill-opacity="0.25"/>
  <!-- słupek -->
  <rect x="18.5" y="46" width="3" height="12" fill="#4A463F"/>

  <!-- tablica -->
  <g filter="url(#tram-cien)">
    <rect x="3" y="1" width="34" height="46" rx="6" fill="#FFFFFF"/>
    <rect x="3" y="1" width="34" height="26" fill="#C4312B" clip-path="url(#tram-tablica)"/>
    <rect x="4" y="2" width="32" height="44" rx="5" fill="none" stroke="#C4312B" stroke-width="2"/>
  </g>

  <!-- piktogram tramwaju -->
  <g transform="translate(11 6) scale(0.75)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="7" width="12" height="12" rx="2.5"/>
    <path d="M6 12.5h12"/>
    <path d="M9 3h6"/>
    <path d="M12 3l-1.5 2L12 7"/>
    <circle cx="9" cy="15.8" r="0.6"/>
    <circle cx="15" cy="15.8" r="0.6"/>
    <path d="M8.5 19l-1 2.5M15.5 19l1 2.5"/>
  </g>

  <!-- liczba linii: zmień zawartość tego elementu -->
  <text id="liczba-linii" x="20" y="36.5" text-anchor="middle" dominant-baseline="central"
        font-family="'Barlow Semi Condensed', 'Arial Narrow', Arial, sans-serif"
        font-size="14" font-weight="700" fill="#1D1D1B">12</text>
</svg>
