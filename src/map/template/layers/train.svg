<svg xmlns="http://www.w3.org/2000/svg" width="40" height="64" viewBox="0 0 40 64">
  <defs>
    <filter id="train-cien" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <clipPath id="train-tablica">
      <rect x="3" y="1" width="34" height="46" rx="6"/>
    </clipPath>
  </defs>

  <!-- cień u podstawy słupka -->
  <ellipse cx="20" cy="60" rx="5" ry="2" fill="#000000" fill-opacity="0.25"/>
  <!-- słupek -->
  <rect x="18.5" y="46" width="3" height="12" fill="#4A463F"/>

  <!-- tablica -->
  <g filter="url(#train-cien)">
    <rect x="3" y="1" width="34" height="46" rx="6" fill="#FFFFFF"/>
    <rect x="3" y="1" width="34" height="26" fill="#26734D" clip-path="url(#train-tablica)"/>
    <rect x="4" y="2" width="32" height="44" rx="5" fill="none" stroke="#26734D" stroke-width="2"/>
  </g>

  <!-- piktogram pociągu: czoło składu na torze -->
  <g transform="translate(11 6) scale(0.75)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 17V7a4 4 0 0 1 4-4h2a4 4 0 0 1 4 4v10z"/>
    <path d="M7 11h10"/>
    <circle cx="9.5" cy="14.2" r="0.6"/>
    <circle cx="14.5" cy="14.2" r="0.6"/>
    <path d="M8.5 17l-2.5 4.5M15.5 17l2.5 4.5M7.5 20h9"/>
  </g>

  <!-- liczba linii: zmień zawartość tego elementu -->
  <text id="liczba-linii" x="20" y="36.5" text-anchor="middle" dominant-baseline="central"
        font-family="'Barlow Semi Condensed', 'Arial Narrow', Arial, sans-serif"
        font-size="14" font-weight="700" fill="#1D1D1B">4</text>
</svg>
